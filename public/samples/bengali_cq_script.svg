<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="100%" height="100%">
  <!-- Paper Background with subtle texture -->
  <rect width="800" height="1100" fill="#fcfbf7" />
  
  <!-- Left Margin Line (Red) -->
  <line x1="110" y1="0" x2="110" y2="1100" stroke="#f87171" stroke-width="1.8" />
  <!-- Double Margin Line -->
  <line x1="114" y1="0" x2="114" y2="1100" stroke="#fca5a5" stroke-width="0.8" opacity="0.6" />
  <!-- Top Margin Line (Red) -->
  <line x1="0" y1="100" x2="800" y2="100" stroke="#f87171" stroke-width="1.5" />
  
  <!-- Horizontal Lined Paper Rules (Blue) -->
  <defs>
    <pattern id="ruledLines" width="800" height="34" patternUnits="userSpaceOnUse">
      <line x1="0" y1="33" x2="800" y2="33" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="0" />
    </pattern>
  </defs>
  <rect x="0" y="100" width="800" height="1000" fill="url(#ruledLines)" />

  <!-- Top Header Metadata (Date, Roll, Page) -->
  <text x="130" y="65" font-family="'Courier New', monospace" font-size="14" fill="#64748b" font-weight="bold">বিষয়: পদার্থবিজ্ঞান ১ম পত্র (সৃজনশীল খাতা)</text>
  <text x="640" y="65" font-family="'Courier New', monospace" font-size="14" fill="#64748b">পৃষ্ঠা নং: ০১</text>
  <text x="130" y="88" font-family="'Courier New', monospace" font-size="12" fill="#94a3b8">বোর্ড রোল: ৪২৮৫৯১ | তারিখ: ২৯/০৯/২০২৬</text>

  <!-- Question Heading (Handwritten Ink Style) -->
  <g fill="#1e293b" font-family="'Comic Sans MS', 'SolaimanLipi', 'Kalpurush', sans-serif">
    <text x="350" y="130" font-size="18" font-weight="bold" text-anchor="middle" text-decoration="underline" fill="#0f172a">১ নং প্রশ্নের উত্তর</text>
    
    <!-- Part (ক) -->
    <text x="130" y="165" font-size="15" font-weight="bold" fill="#0369a1">(ক)</text>
    <text x="170" y="165" font-size="14" fill="#1e293b">প্রাস (Projectile):</text>
    <text x="130" y="198" font-size="14" fill="#334155">তির্যকভাবে বা অনুভূমিকের সাথে কোনো কোণে মহাশূন্যে বা বাতাসে নিক্ষিপ্ত বস্তুকে</text>
    <text x="130" y="232" font-size="14" fill="#334155">প্রাস বলা হয়। যেমন—নিক্ষিপ্ত ক্রিকেট বল, বুলেটের গতি।</text>
    
    <!-- Teacher Red Pen Mark for (ka) -->
    <path d="M 680 180 L 695 200 L 735 155" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <text x="740" y="180" font-family="sans-serif" font-size="18" font-weight="bold" fill="#dc2626">১</text>

    <!-- Part (খ) -->
    <text x="130" y="295" font-size="15" font-weight="bold" fill="#0369a1">(খ)</text>
    <text x="130" y="332" font-size="14" fill="#334155">চলন্ত বাস থেকে হঠাৎ নামলে গতিজড়তার কারণে যাত্রী সামনের দিকে ঝুঁকে পড়ে।</text>
    <text x="130" y="366" font-size="14" fill="#334155">ব্যাখ্যা: বাস যখন চলতে থাকে, তখন যাত্রীর সমগ্র শরীর বাসের সমান গতিবেগ লাভ</text>
    <text x="130" y="400" font-size="14" fill="#334155">করে। যাত্রী হঠাৎ বাস থেকে নামলে তার পা ভূমির সংস্পর্শে এসে তৎক্ষণাৎ স্থির হয়।</text>
    <text x="130" y="434" font-size="14" fill="#334155">কিন্তু শরীরের ঊর্ধ্বাংশ গতিজড়তার জন্য আগের বেগ বজায় রেখে সামনে এগিয়ে যেতে</text>
    <text x="130" y="468" font-size="14" fill="#334155">চায়। ফলে যাত্রী সামনের দিকে ছিটকে পড়ে বা ঝুঁকে পড়ে।</text>

    <!-- Teacher Red Pen Mark for (kha) -->
    <path d="M 680 370 L 695 390 L 735 345" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <text x="740" y="375" font-family="sans-serif" font-size="18" font-weight="bold" fill="#dc2626">২</text>

    <!-- Part (গ) -->
    <text x="130" y="530" font-size="15" font-weight="bold" fill="#0369a1">(গ)</text>
    <text x="170" y="530" font-size="14" fill="#1e293b">উদ্দীপক অনুসারে,</text>
    <text x="130" y="565" font-size="14" fill="#334155">ক্রিকেট বলের নিক্ষেপণ বেগ, v₀ = 40 ms⁻¹</text>
    <text x="440" y="565" font-size="14" fill="#334155">নিক্ষেপণ কোণ, θ = 30°</text>
    <text x="130" y="598" font-size="14" fill="#334155">অভিকর্ষজ ত্বরণ, g = 9.8 ms⁻²</text>
    <text x="440" y="598" font-size="14" fill="#334155">সর্বোচ্চ উচ্চতায় পৌঁছানোর সময়, t = ?</text>
    
    <text x="130" y="640" font-size="14" fill="#1e293b">আমরা জানি,</text>
    <text x="130" y="675" font-size="15" font-weight="bold" fill="#0f172a">t = (v₀ · sinθ) / g</text>
    <text x="130" y="710" font-size="14" fill="#334155">⇒ t = (40 × sin 30°) / 9.8</text>
    <text x="130" y="745" font-size="14" fill="#334155">⇒ t = (40 × 0.5) / 9.8 = 20 / 9.8</text>
    <text x="130" y="780" font-size="15" font-weight="bold" fill="#0f172a">∴ t = 2.041 s ≈ 2.04 সেকেন্ড (Ans.)</text>

    <!-- Teacher Red Pen Mark for (ga) -->
    <path d="M 680 670 L 695 690 L 735 645" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <text x="730" y="675" font-family="sans-serif" font-size="18" font-weight="bold" fill="#dc2626">২.৫</text>

    <!-- Part (ঘ) -->
    <text x="130" y="840" font-size="15" font-weight="bold" fill="#0369a1">(ঘ)</text>
    <text x="170" y="840" font-size="14" fill="#1e293b">নিক্ষেপণ বিন্দুতে বলটির আদি গতিশক্তি,</text>
    <text x="130" y="875" font-size="15" font-weight="bold" fill="#0f172a">E_k1 = ½ m v₀²</text>
    
    <text x="130" y="910" font-size="14" fill="#334155">সর্বোচ্চ বিন্দুতে উল্লম্ব বেগ, v_y = 0 এবং অনুভূমিক বেগ, v_x = v₀ cos 30°</text>
    <text x="130" y="945" font-size="14" fill="#334155">অতএব, সর্বোচ্চ বিন্দুতে মোট বেগ v' = v_x = v₀ cos 30°</text>
    <text x="130" y="980" font-size="15" font-weight="bold" fill="#0f172a">E_k2 = ½ m (v')² = ½ m (v₀ cos 30°)² = ½ m v₀² × (√3/2)²</text>
    <text x="130" y="1015" font-size="15" font-weight="bold" fill="#0f172a">⇒ E_k2 = E_k1 × ¾ = ¾ E_k1</text>
    <text x="130" y="1048" font-size="14" fill="#334155">সুতরাং সর্বোচ্চ বিন্দুতে গতিশক্তি নিক্ষেপণ বিন্দুর গতিশক্তির ¾ গুণ। (যাচাই হলো)</text>

    <!-- Teacher Red Pen Mark for (gha) -->
    <path d="M 680 940 L 695 960 L 735 915" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <text x="730" y="945" font-family="sans-serif" font-size="18" font-weight="bold" fill="#dc2626">৩.৫</text>
  </g>

  <!-- Big Red Teacher Total Circle on Top Right -->
  <g transform="translate(680, 50)">
    <circle cx="25" cy="25" r="30" fill="none" stroke="#dc2626" stroke-width="2.5" />
    <text x="25" y="24" font-family="'Times New Roman', serif" font-size="18" font-weight="bold" fill="#dc2626" text-anchor="middle">৯/১০</text>
    <text x="25" y="42" font-family="'Times New Roman', serif" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">A+</text>
  </g>
</svg>
